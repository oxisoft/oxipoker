name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: go vet ./...
      - run: go test -race ./...

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: app/build/web
          retention-days: 3

  image:
    runs-on: ubuntu-latest
    needs: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: app/build/web
      - uses: docker/setup-buildx-action@v4
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: webapp=app/build/web
          load: true
          tags: oxipoker:ci
          build-args: VERSION=ci-${{ github.sha }}
      - name: Smoke test
        run: |
          docker run -d --name smoke -p 8080:8080 oxipoker:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8080/api/v1/health | grep -q '"webapp":true'
          curl -fsS http://127.0.0.1:8080/ | grep -q flutter_bootstrap.js

  # Every green main commit becomes ghcr.io/oxisoft/oxipoker:edge (amd64 +
  # arm64), which the test server follows. Releases go to Docker Hub.
  edge:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [server, image]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: app/build/web
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: webapp=app/build/web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=edge-${{ github.sha }}
          tags: |
            ghcr.io/oxisoft/oxipoker:edge
            ghcr.io/oxisoft/oxipoker:sha-${{ github.sha }}
