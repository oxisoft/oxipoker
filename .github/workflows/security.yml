name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1" # weekly: new advisories arrive without new commits
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: govulncheck (Go modules and the standard library)
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  hidden-cards:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: No hidden card in any view or history response (full table, many hands)
        run: go test -race -count=3 -run 'TestNoHiddenCardsAcrossAFullTable|TestViewsNeverLeakHiddenCards|TestPlayersOnlyEverGetTheirOwnHoleCards' ./internal/httpapi ./internal/table ./internal/realtime

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
