# Release: pushing a tag vX.Y.Z builds the multi-arch image (linux/amd64 +
# linux/arm64) with the web app inside and publishes oxisoft/oxipoker:X.Y.Z,
# :X.Y and :latest to Docker Hub. Release notes are written by hand afterwards.
#
# Repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (push rights to
# oxisoft/oxipoker).
name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - working-directory: app
        run: |
          flutter pub get
          flutter test
          flutter build web --release
      - uses: actions/upload-artifact@v7
        with:
          name: web
          path: app/build/web

  image:
    runs-on: ubuntu-latest
    needs: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: web
          path: app/build/web
      - id: v
        run: |
          V="${GITHUB_REF_NAME#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "minor=${V%.*}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          build-contexts: webapp=app/build/web
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            oxisoft/oxipoker:${{ steps.v.outputs.version }}
            oxisoft/oxipoker:${{ steps.v.outputs.minor }}
            oxisoft/oxipoker:latest

  github-release:
    runs-on: ubuntu-latest
    needs: image
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Release notes follow." --verify-tag
